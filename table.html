<!DOCTYPE html>
<html>
<head>
  <title>Multiplication Table</title>
</head>
<body>

<h1>Multiplication Table (1–10)</h1>

<table border="1">
  <tr>
    <th>*</th>
    <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
    <th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
  </tr>

  <!-- Rows -->
  <script>
    for (let i = 1; i <= 10; i++) {
      document.write("<tr>");
      document.write("<th>" + i + "</th>");
      for (let j = 1; j <= 10; j++) {
        document.write("<td>" + (i * j) + "</td>");
      }
      document.write("</tr>");
    }
  </script>

</table>

<br>

</body>
</html>
